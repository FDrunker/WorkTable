# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 微信聊天分析（恋爱军师）
wechat:
  # 数据源：mock（内置样例，无需外部依赖）| cli（调用本地 wechat-cli）
  datasource: mock
  cli:
    # wechat-cli 可执行文件绝对路径。留空则依次尝试 WECHAT_CLI_BINARY 环境变量与 PATH。
    # 示例（Windows）: E:/home/zuijiu/.pure-npm-global/wechat-cli.cmd
    executable: ""
    timeout-seconds: 120
    # wechat-cli 源码中单次查询上限为 500，不要调大
    batch-size: 500
    # 留空表示自动探测编码（UTF-8 失败回退 GBK）
    charset: ""
  clean:
    # 丢弃表情/通话/撤回/系统提示等无措辞内容
    drop-noise: true
    # 连续同一人发言达到该条数时折叠合并，保留"刷屏"这一行为特征
    collapse-repeat-threshold: 5
    # 手机号/身份证/银行卡脱敏。数据要发送到云端 API，建议保持开启
    mask-sensitive: true
    # 送入 LLM 的上下文字符预算
    context-char-budget: 40000
    # 单次分析最多处理多少条未分析消息（超出的部分下次分析继续）
    max-unanalyzed-per-analysis: 500
    # 前端聊天记录每页条数
    message-page-size: 50
  skill:
    # 军师知识库位置。需把 goutoujunshi 的 SKILL.md 与 references/ 放到该目录下
    location: classpath:skill/
    max-references: 3
  llm:
    # OpenAI 兼容接口。DeepSeek: https://api.deepseek.com ；通义: https://dashscope.aliyuncs.com/compatible-mode
    # 本地 Ollama: http://localhost:11434
    base-url: ""
    # 生产环境请用环境变量注入，不要提交真实 Key
    api-key: ""
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 4096
    connect-timeout-ms: 10000
    # 长文分析耗时较长，读超时需要放宽
    read-timeout-ms: 180000
    # 仅对 429 / 5xx 重试，不对 4xx 重试
    max-retries: 2
